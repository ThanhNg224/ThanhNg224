<svg xmlns="http://www.w3.org/2000/svg" width="250" height="96" viewBox="0 0 250 96" role="img" aria-labelledby="title description">
  <title id="title">Jetpack Compose starter</title>
  <desc id="description">Kotlin starter with navigation and offline caching.</desc>
  <style>
    .panel { fill: #f4faf7; stroke: #bed7cd; }
    .icon-tile { fill: #d8eee5; }
    .icon { fill: none; stroke: #19654f; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: #19654f; stroke: none; }
    .name { fill: #15483a; font: 650 15px system-ui, sans-serif; }
    .copy { fill: #38544a; font: 13px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #132023; stroke: #305048; }
      .icon-tile { fill: #1d3933; }
      .icon { stroke: #84e4be; }
      .solid { fill: #84e4be; }
      .name { fill: #d7f6eb; }
      .copy { fill: #afc9c0; }
    }
  </style>
  <rect class="panel" x=".5" y=".5" width="249" height="95" rx="12"/>
  <rect class="icon-tile" x="14" y="13" width="30" height="30" rx="8"/>
  <g class="icon" transform="translate(20 19)"><path d="M1.5 6.25 9 2l7.5 4.25L9 10.5 1.5 6.25Zm0 4L9 14.5l7.5-4.25"/></g>
  <text class="name" x="53" y="33">Jetpack Compose starter</text>
  <text class="copy" x="15" y="62">Kotlin starter with navigation</text>
  <text class="copy" x="15" y="79">and offline caching.</text>
</svg>
